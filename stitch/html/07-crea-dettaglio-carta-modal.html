<!DOCTYPE html>

<html lang="it"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>MÖVAT! - Dettaglio carta</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              green: '#22a038',
              'green-dark': '#136728',
              'green-light': '#e9f7ea',
              'green-soft': '#d6f0db',
              text: '#0b3520'
            }
          },
          fontFamily: {
            comic: ['"Nunito"', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    }
  </script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-styling">
    body {
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .modal-shadow {
      box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body class="bg-gray-200 flex justify-center items-center min-h-screen p-0 sm:p-4 select-none">
<!-- BEGIN: MobileContainer -->
<div class="relative w-full max-w-[430px] h-[932px] max-h-screen bg-[#35a83a] rounded-[42px] border-[8px] border-[#187529] overflow-hidden flex flex-col shadow-2xl">
<!-- BEGIN: BackgroundHeaderArea -->
<!-- Elementi di sfondo visibili sotto l'overlay -->
<header class="relative px-5 pt-8 pb-3 flex items-center justify-between" data-purpose="app-header">
<!-- Back Button -->
<button aria-label="Indietro" class="w-11 h-11 rounded-full bg-white/40 flex items-center justify-center text-brand-text shadow-sm">
<svg class="w-6 h-6 stroke-[3]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Logo MÖVAT! Header -->
<div class="flex items-center gap-2">
<div class="text-3xl font-black italic tracking-wide text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.4)] stroke-text">
          MÖVAT!
        </div>
<!-- Little Bus/Truck Icon Mascot -->
<div class="relative w-16 h-10 bg-white rounded-lg border-2 border-black flex items-center justify-end pr-1 shadow">
<div class="w-4 h-5 border-2 border-black rounded-sm mr-1 bg-green-500"></div>
<div class="w-3 h-3 rounded-full bg-white border border-black flex items-center justify-center">
<div class="w-1.5 h-1.5 rounded-full bg-black"></div>
</div>
<div class="absolute -top-3 left-1 flex gap-0.5">
<span class="w-2.5 h-3.5 bg-red-500 rounded-t-sm inline-block"></span>
<span class="w-2.5 h-4.5 bg-blue-500 rounded-t-sm inline-block"></span>
</div>
</div>
</div>
</header>
<!-- END: BackgroundHeaderArea -->
<!-- BEGIN: BackgroundMainCardList -->
<!-- Contenuto principale retrostante, leggermente oscurato dal backdrop -->
<main class="flex-1 bg-white rounded-t-[34px] px-5 pt-6 pb-2 flex flex-col gap-4 overflow-hidden relative">
<h1 class="text-[26px] font-black text-[#0d3b1f] tracking-tight">Scegli le carte Busa</h1>
<!-- Progress Stepper -->
<div class="flex items-center justify-between px-3 py-1">
<div class="flex flex-col items-center">
<div class="w-8 h-8 rounded-full bg-[#1c842b] text-white flex items-center justify-center font-black text-sm">1</div>
<span class="text-xs font-black text-[#1c842b] mt-1">Carte</span>
</div>
<div class="h-0.5 flex-1 bg-gray-300 mx-2 -mt-4"></div>
<div class="flex flex-col items-center opacity-40">
<div class="w-8 h-8 rounded-full bg-gray-400 text-white flex items-center justify-center font-bold text-sm">2</div>
<span class="text-xs font-bold text-gray-600 mt-1">Dettagli</span>
</div>
<div class="h-0.5 flex-1 bg-gray-300 mx-2 -mt-4"></div>
<div class="flex flex-col items-center opacity-40">
<div class="w-8 h-8 rounded-full bg-gray-400 text-white flex items-center justify-center font-bold text-sm">3</div>
<span class="text-xs font-bold text-gray-600 mt-1">Invia</span>
</div>
</div>
<!-- Search and Filter Bar -->
<div class="flex items-center gap-2">
<div class="relative flex-1">
<svg class="w-4 h-4 absolute left-3 top-3 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
<input class="w-full pl-9 pr-3 py-2 text-xs font-bold rounded-xl border border-gray-300 bg-gray-50 focus:outline-none" disabled="" placeholder="Nome o numero della carta" type="text"/>
</div>
<div class="flex items-center gap-1.5 px-2.5 py-2 rounded-xl border border-gray-200 bg-gray-50 text-[11px] font-black text-[#136728]">
<span class="w-4 h-4 rounded-full bg-[#22a038] text-white flex items-center justify-center text-[10px]">✓</span>
          Solo selezionate
        </div>
</div>
<!-- Lista carte retrostante -->
<div class="grid grid-cols-2 gap-3 opacity-60">
<div class="border-2 border-emerald-500 rounded-2xl h-36 bg-emerald-100 p-2 relative overflow-hidden">
<span class="bg-[#1c4d28] text-white text-[10px] font-black px-2 py-0.5 rounded-md">#...</span>
</div>
<div class="border-2 border-emerald-500 rounded-2xl h-36 bg-emerald-100 p-2 relative overflow-hidden">
<span class="bg-[#1c4d28] text-white text-[10px] font-black px-2 py-0.5 rounded-md">#...</span>
</div>
</div>
</main>
<!-- END: BackgroundMainCardList -->
<!-- BEGIN: BackgroundBottomBar -->
<!-- Bottom action and bar -->
<div class="bg-white border-t border-gray-200 px-5 pt-3 pb-2 flex items-center justify-between z-0">
<div class="text-[#0d3b1f] font-black text-sm">
        6 <span class="font-bold text-xs">carte Busa selezionate</span>
</div>
<button class="bg-[#106927] text-white font-black px-6 py-2.5 rounded-2xl text-sm shadow">
        Continua
      </button>
</div>
<!-- Bottom Navigation Bar -->
<nav class="bg-white border-t border-gray-100 px-3 py-2 flex justify-around items-center z-0" data-purpose="bottom-navigation">
<div class="flex flex-col items-center text-gray-500">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span class="text-[10px] font-black mt-0.5">Home</span>
</div>
<div class="flex flex-col items-center text-gray-500">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span class="text-[10px] font-black mt-0.5">Ascolta</span>
</div>
<div class="flex flex-col items-center text-gray-500">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span class="text-[10px] font-black mt-0.5">Scopri</span>
</div>
<div class="flex flex-col items-center bg-[#d6f0db] px-4 py-1 rounded-2xl text-[#166e2c]">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"></path></svg>
<span class="text-[10px] font-black mt-0.5">Crea</span>
</div>
<div class="flex flex-col items-center text-gray-500">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span class="text-[10px] font-black mt-0.5">FAQ</span>
</div>
</nav>
<!-- END: BackgroundBottomBar -->
<!-- BEGIN: ModalOverlay -->
<!-- Backdrop scuro con sfocatura -->
<div class="absolute inset-0 bg-black/45 backdrop-blur-[2px] z-30 flex items-center justify-center p-5" data-purpose="modal-backdrop">
<!-- BEGIN: CardDetailPopup -->
<!-- Finestra Modale Bianca Arrotondata -->
<div class="relative w-full max-w-[340px] bg-white rounded-[28px] p-5 pt-4 flex flex-col items-center modal-shadow z-40 border border-white/60" data-purpose="card-modal-content">
<!-- Pulsante di Chiusura (X) -->
<button aria-label="Chiudi finestra" class="absolute top-3.5 right-3.5 w-8 h-8 rounded-full bg-[#ebf7ec] hover:bg-[#ddf0de] active:scale-95 flex items-center justify-center text-[#1c7b30] transition shadow-sm">
<svg class="w-4 h-4 stroke-[3]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Immagine/Illustrazione della Carta -->
<div class="w-full mt-2 rounded-2xl overflow-hidden border-2 border-lime-300 relative bg-[#7cd827] shadow-inner" style="aspect-ratio: 16/11;">
<!-- Badge con numero carta -->
<div class="absolute top-2.5 left-2.5 z-20 bg-[#164421] text-white text-[11px] font-black tracking-widest px-2.5 py-0.5 rounded-md shadow">
            #...
          </div>
<!-- Raggi di sfondo e grafica fumettistica -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-yellow-200 via-lime-400 to-green-500 opacity-95"></div>
<!-- Schizzi e macchie di colore (rosso, blu, giallo) con camioncino stilizzato -->
<div class="absolute inset-0 flex items-center justify-center p-3">
<div class="relative w-full h-full flex flex-col items-center justify-end">
<!-- Getti e Secchi di Vernice Esplosi -->
<div class="relative w-full flex justify-center -mb-2 z-10">
<!-- Macchia/Goccia Rossa -->
<div class="w-8 h-10 bg-red-600 rounded-t-full rotate-[-12deg] border-2 border-white shadow-sm flex items-start justify-center">
<div class="w-2 h-2 rounded-full bg-white/60 mt-1"></div>
</div>
<!-- Schizzo Blu centrale -->
<div class="w-9 h-12 bg-blue-600 rounded-t-full border-2 border-white shadow-md mx-1"></div>
<!-- Secchio Giallo rovesciato -->
<div class="w-8 h-10 bg-yellow-400 rounded-t-md rotate-[18deg] border-2 border-white shadow-sm flex flex-col items-center">
<div class="w-full h-2 bg-yellow-500 rounded-t-sm"></div>
</div>
</div>
<!-- Camioncino Mascotte MÖVAT -->
<div class="relative z-15 w-[85%] bg-white rounded-lg border-[2.5px] border-black p-1 shadow-lg flex items-center">
<!-- Cassone Verde del furgone -->
<div class="w-2/5 h-8 bg-[#2bb33b] border-2 border-black rounded-sm flex items-center justify-center">
<span class="w-2 h-2 bg-white/40 rounded-full"></span>
</div>
<!-- Cabina Bianca con Occhioni Cartoon -->
<div class="w-3/5 h-9 bg-white border-l-2 border-black flex items-center justify-center gap-1 pl-1">
<!-- Occhio sinistro -->
<div class="w-4 h-5 rounded-full border-2 border-black bg-white flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-black"></div>
</div>
<!-- Occhio destro -->
<div class="w-4 h-5 rounded-full border-2 border-black bg-white flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-black"></div>
</div>
</div>
<!-- Ruote sottostanti -->
<div class="absolute -bottom-2.5 left-3 w-4 h-4 rounded-full bg-black border-2 border-white flex items-center justify-center">
<div class="w-1.5 h-1.5 rounded-full bg-gray-400"></div>
</div>
<div class="absolute -bottom-2.5 right-4 w-4 h-4 rounded-full bg-black border-2 border-white flex items-center justify-center">
<div class="w-1.5 h-1.5 rounded-full bg-gray-400"></div>
</div>
</div>
</div>
</div>
</div>
<!-- Titolo e Sottotitolo Carta -->
<div class="text-center mt-3" data-purpose="card-info-header">
<h2 class="text-[20px] font-black text-[#0a331c] tracking-tight leading-tight">
            Svuota colore
          </h2>
<p class="text-[12px] font-bold text-gray-500 mt-0.5">
            Anteprima della carta
          </p>
</div>
<!-- Riquadro Effetto della Carta -->
<div class="w-full mt-3 bg-white border border-[#c4e6cb] rounded-2xl p-3 relative shadow-xs" data-purpose="card-effect-box">
<span class="inline-block bg-[#e5f5e7] text-[#1c6f30] text-[11px] font-black px-2.5 py-0.5 rounded-full mb-1">
            Effetto della carta
          </span>
<p class="text-[13px] font-bold text-[#143d23] mt-1 pl-0.5">
            Consulta il testo sulla carta.
          </p>
</div>
<!-- Selettore Quantità Carta (+ / -) -->
<div class="flex items-center justify-center gap-3.5 my-4" data-purpose="quantity-selector">
<!-- Tasto Meno (-) -->
<button aria-label="Diminuisci quantità" class="w-10 h-10 rounded-full bg-[#e8f6ea] hover:bg-[#daf0dd] active:scale-95 text-[#1a792e] flex items-center justify-center font-black text-xl transition">
<svg class="w-4 h-4 stroke-[3.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M20 12H4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Valore Quantità -->
<div class="w-16 h-10 rounded-full bg-white border border-gray-100 flex items-center justify-center font-black text-lg text-[#0a311b] shadow-inner">
            1
          </div>
<!-- Tasto Più (+) -->
<button aria-label="Aumenta quantità" class="w-10 h-10 rounded-full bg-[#1e9a34] hover:bg-[#18852c] active:scale-95 text-white flex items-center justify-center font-black text-xl transition shadow">
<svg class="w-4 h-4 stroke-[3.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Pulsante di Conferma Principale -->
<button class="w-full py-3.5 bg-[#25a538] hover:bg-[#1e8d2e] active:scale-[0.99] text-white rounded-2xl font-black text-[17px] tracking-wide shadow-md hover:shadow-lg transition flex items-center justify-center" data-purpose="confirm-button">
          Conferma
        </button>
</div>
<!-- END: CardDetailPopup -->
</div>
<!-- END: ModalOverlay -->
</div>
<!-- END: MobileContainer -->
</body></html>
