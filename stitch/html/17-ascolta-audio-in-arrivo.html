<!DOCTYPE html>

<html lang="it"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Mövat! - Ascolta Dettaglio Carta</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'movat-green': '#259e19',
            'movat-green-dark': '#13471c',
            'movat-lime': '#88d813',
            'movat-bg': '#f3f4f6',
            'movat-border': '#e2ebd8'
          },
          fontFamily: {
            sans: ['"Nunito"', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- Google Fonts for cartoonish rounded typography -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-styling">
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #d7eec3;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Sunburst / Ray effect background */
    .sunburst-bg {
      background: repeating-conic-gradient(
        from 0deg,
        #7fd405 0deg 15deg,
        #9ce715 15deg 30deg
      );
    }

    /* Comic text outline effects */
    .comic-text-stroke {
      -webkit-text-stroke: 4px #0d3412;
      paint-order: stroke fill;
    }

    .comic-text-stroke-sm {
      -webkit-text-stroke: 2.5px #143516;
      paint-order: stroke fill;
    }

    /* Soft inner shadow for cards */
    .card-border-glow {
      box-shadow: 0 0 0 1.5px #84d812, 0 4px 12px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">
<!-- BEGIN: MobileDeviceFrame -->
<div class="w-full max-w-[430px] min-h-[920px] bg-white rounded-[40px] shadow-2xl overflow-hidden flex flex-col relative border-4 border-emerald-500/20">
<!-- BEGIN: TopHeaderSection -->
<header class="relative w-full h-[120px] sunburst-bg overflow-hidden flex-shrink-0" data-purpose="app-header">
<!-- Decorative landscape silhouette -->
<div class="absolute bottom-0 inset-x-0 h-10 pointer-events-none">
<svg class="w-full h-full fill-[#52a714] opacity-90" preserveaspectratio="none" viewbox="0 0 500 80">
<path d="M0,80 L0,30 Q30,10 60,35 Q100,60 140,25 Q180,-10 230,25 Q280,60 340,15 Q390,-20 440,30 Q470,55 500,20 L500,80 Z"></path>
</svg>
</div>
<!-- Header Content Bar -->
<div class="relative z-10 flex items-center justify-between px-4 pt-4">
<!-- Back Button -->
<button aria-label="Torna indietro" class="w-11 h-11 bg-white/95 rounded-full flex items-center justify-center shadow-md active:scale-95 transition-transform" type="button">
<svg class="w-6 h-6 text-emerald-900 font-bold" fill="none" stroke="currentColor" stroke-width="3.5" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Center App Logo MÖVAT! -->
<div class="flex items-center -ml-2">
<span class="text-3xl font-black text-white tracking-wider comic-text-stroke transform -rotate-2 select-none" style="filter: drop-shadow(0 3px 0 #0d3412);">
            MÖVAT!
          </span>
</div>
<!-- Header Truck / Mascot Illustration Placeholder -->
<div class="flex items-center space-x-1">
<div class="relative w-20 h-11 flex items-end">
<!-- Mini Truck Graphic -->
<svg class="w-full h-full filter drop-shadow" viewbox="0 0 100 65">
<!-- Cards Stack in truck -->
<rect fill="#e52424" height="28" rx="2" stroke="#000" stroke-width="2.5" transform="rotate(-12 34 18)" width="18" x="25" y="4"></rect>
<rect fill="#0088cc" height="28" rx="2" stroke="#000" stroke-width="2.5" width="18" x="42" y="2"></rect>
<rect fill="#75bb19" height="26" rx="2" stroke="#000" stroke-width="2.5" transform="rotate(10 65 21)" width="18" x="56" y="8"></rect>
<!-- Body -->
<rect fill="#ffffff" height="20" rx="3" stroke="#000" stroke-width="3" width="55" x="18" y="28"></rect>
<rect fill="#259e19" height="5" width="51" x="20" y="30"></rect>
<!-- Cab -->
<path d="M70,24 L86,24 Q92,24 92,30 L92,48 L70,48 Z" fill="#ffffff" stroke="#000" stroke-width="3"></path>
<!-- Big Eyes -->
<circle cx="77" cy="34" fill="#ffffff" r="5.5" stroke="#000" stroke-width="2"></circle>
<circle cx="79" cy="34" fill="#000" r="2.5"></circle>
<circle cx="87" cy="34" fill="#ffffff" r="5.5" stroke="#000" stroke-width="2"></circle>
<circle cx="89" cy="34" fill="#000" r="2.5"></circle>
<!-- Wheels -->
<circle cx="32" cy="48" fill="#444" r="6" stroke="#000" stroke-width="3"></circle>
<circle cx="32" cy="48" fill="#ccc" r="2"></circle>
<circle cx="78" cy="48" fill="#444" r="6" stroke="#000" stroke-width="3"></circle>
<circle cx="78" cy="48" fill="#ccc" r="2"></circle>
</svg>
</div>
<!-- Signpost -->
<div class="flex flex-col items-center">
<div class="w-4 h-2.5 bg-red-600 rounded-sm border border-black transform -rotate-6 mb-0.5"></div>
<div class="w-4 h-2.5 bg-green-600 rounded-sm border border-black transform rotate-6"></div>
<div class="w-1 h-3 bg-black"></div>
</div>
</div>
</div>
</header>
<!-- END: TopHeaderSection -->
<!-- BEGIN: MainContent -->
<main class="flex-1 bg-white -mt-4 rounded-t-[32px] px-4 pt-3 pb-24 overflow-y-auto z-10 flex flex-col items-center" data-purpose="card-detail-view">
<!-- Title Area with Burst Accents -->
<div class="flex flex-col items-center justify-center text-center mb-2.5">
<div class="flex items-center justify-center gap-2">
<!-- Left ray accent -->
<div class="flex flex-col gap-1 items-end -rotate-12">
<span class="w-3.5 h-1.5 bg-[#8bd918] rounded-full transform rotate-45"></span>
<span class="w-2.5 h-1.5 bg-[#8bd918] rounded-full"></span>
</div>
<h1 class="text-[28px] font-black text-[#15461c] tracking-tight">
            Affare fatto
          </h1>
<!-- Right ray accent -->
<div class="flex flex-col gap-1 items-start rotate-12">
<span class="w-3.5 h-1.5 bg-[#8bd918] rounded-full transform -rotate-45"></span>
<span class="w-2.5 h-1.5 bg-[#8bd918] rounded-full"></span>
</div>
</div>
<p class="text-[#2b4c2b] text-base font-bold tracking-tight -mt-0.5">
          Dettagli della carta
        </p>
</div>
<!-- Illustrated Feature Card (Exact Representation) -->
<div class="w-full rounded-[26px] overflow-hidden border-[2.5px] border-[#92dc22] relative sunburst-bg shadow-sm mb-3.5" data-purpose="illustrated-card">
<div class="relative w-full h-[185px] flex flex-col items-center justify-between p-2">
<!-- Background Trees Silhouette inside Card -->
<div class="absolute inset-0 flex justify-between items-end px-2 pointer-events-none pb-2 opacity-85">
<div class="w-8 h-24 bg-[#237c15] rounded-full scale-y-125"></div>
<div class="w-10 h-28 bg-[#1f6d13] rounded-full -ml-3 scale-y-110"></div>
<div class="flex-1"></div>
<div class="w-9 h-28 bg-[#1f6d13] rounded-full scale-y-110"></div>
<div class="w-8 h-24 bg-[#237c15] rounded-full -mr-2 scale-y-125"></div>
</div>
<!-- Card comic banner title -->
<div class="relative z-10 pt-1 text-center">
<span class="text-3xl font-black text-white tracking-wide comic-text-stroke select-none">
              Affare fatto
            </span>
</div>
<!-- Central Mascot Illustration: Handshake & Green Truck -->
<div class="relative z-10 w-full flex flex-col items-center -mt-1">
<!-- Handshake Icon with Speed Lines -->
<div class="relative mb-0.5">
<!-- Glow/Burst lines behind handshake -->
<div class="absolute -inset-2 flex items-center justify-center opacity-80 pointer-events-none">
<span class="absolute -left-3 top-0 w-2 h-1 bg-white rounded-full -rotate-45"></span>
<span class="absolute -right-3 top-0 w-2 h-1 bg-white rounded-full rotate-45"></span>
<span class="absolute -left-4 bottom-1 w-2.5 h-1 bg-white rounded-full"></span>
<span class="absolute -right-4 bottom-1 w-2.5 h-1 bg-white rounded-full"></span>
</div>
<svg class="w-24 h-14" viewbox="0 0 120 70">
<!-- Left Hand/Arm -->
<path d="M12,42 L35,42 L48,32 L62,38 L48,50 L25,50 L12,42 Z" fill="#2e9b1d" stroke="#000" stroke-linejoin="round" stroke-width="3"></path>
<rect fill="#1b6311" height="18" rx="2" stroke="#000" stroke-width="3" width="10" x="8" y="32"></rect>
<!-- Right Hand/Arm -->
<path d="M108,42 L85,42 L72,32 L58,38 L72,50 L95,50 L108,42 Z" fill="#2e9b1d" stroke="#000" stroke-linejoin="round" stroke-width="3"></path>
<rect fill="#1b6311" height="18" rx="2" stroke="#000" stroke-width="3" width="10" x="102" y="32"></rect>
<!-- Clasping Hands (Skin Color) -->
<path d="M42,35 C42,25 60,25 65,33 C70,25 78,32 74,40 C70,47 52,50 44,43 Z" fill="#fde3be" stroke="#000" stroke-linejoin="round" stroke-width="3.5"></path>
<path d="M50,34 L56,42 M58,32 L64,41 M66,33 L71,40" stroke="#000" stroke-linecap="round" stroke-width="2.5"></path>
</svg>
</div>
<!-- Busa Truck Mascot -->
<div class="relative w-56 h-16 -mt-3">
<svg class="w-full h-full filter drop-shadow-md" viewbox="0 0 200 65">
<!-- Cargo Container -->
<rect fill="#ffffff" height="25" rx="4" stroke="#000" stroke-width="3.5" width="70" x="25" y="16"></rect>
<path d="M28,21 L92,21 L92,26 L28,26 Z" fill="#259e19"></path>
<!-- Cabin -->
<path d="M95,20 L124,20 Q135,20 135,28 L135,42 L95,42 Z" fill="#ffffff" stroke="#000" stroke-width="3.5"></path>
<!-- 'busa' text on door -->
<text fill="#259e19" font-family="'Nunito', sans-serif" font-size="10" font-weight="900" x="100" y="33">busa</text>
<!-- Eyes -->
<circle cx="118" cy="22" fill="#ffffff" r="7.5" stroke="#000" stroke-width="2.5"></circle>
<circle cx="120" cy="22" fill="#000" r="3.5"></circle>
<circle cx="132" cy="22" fill="#ffffff" r="7.5" stroke="#000" stroke-width="2.5"></circle>
<circle cx="134" cy="22" fill="#000" r="3.5"></circle>
<!-- Bumper & smile -->
<rect fill="#259e19" height="5" rx="2" stroke="#000" stroke-width="2" width="16" x="115" y="38"></rect>
<path d="M120,33 Q124,36 128,33" fill="none" stroke="#000" stroke-linecap="round" stroke-width="1.8"></path>
<!-- Wheels -->
<circle cx="45" cy="42" fill="#444" r="7.5" stroke="#000" stroke-width="3.5"></circle>
<circle cx="45" cy="42" fill="#fff" r="2.5"></circle>
<circle cx="75" cy="42" fill="#444" r="7.5" stroke="#000" stroke-width="3.5"></circle>
<circle cx="75" cy="42" fill="#fff" r="2.5"></circle>
<circle cx="123" cy="42" fill="#444" r="5" stroke="#000" stroke-width="3"></circle>
</svg>
</div>
</div>
<!-- Bottom Left Tag '#...' -->
<div class="absolute bottom-2.5 left-2.5 bg-white/95 px-2.5 py-0.5 rounded-full border border-gray-400/50 shadow-sm">
<span class="text-xs font-black text-gray-800 tracking-wider">#...</span>
</div>
</div>
</div>
<!-- BEGIN: AudioPendingStatusBox -->
<section class="w-full bg-[#f8fbf4] rounded-[26px] border border-[#ddead1] p-4 flex flex-col items-center text-center shadow-sm mb-3" data-purpose="audio-status-box">
<!-- Big Muted Speaker Icon with accents -->
<div class="relative my-2 flex items-center justify-center">
<!-- Ambient Green Sound Rays (Disabled/Light) -->
<div class="absolute -left-5 top-2 flex flex-col gap-1 -rotate-12 opacity-80">
<span class="w-3.5 h-1.5 bg-[#96dc37] rounded-full transform rotate-30"></span>
<span class="w-2.5 h-1.5 bg-[#96dc37] rounded-full"></span>
</div>
<div class="absolute -right-5 top-2 flex flex-col gap-1 rotate-12 opacity-80">
<span class="w-3.5 h-1.5 bg-[#96dc37] rounded-full transform -rotate-30"></span>
<span class="w-2.5 h-1.5 bg-[#96dc37] rounded-full"></span>
</div>
<!-- Muted Speaker Graphic -->
<div class="relative w-20 h-20 flex items-center justify-center">
<!-- Speaker body in light pastel green -->
<svg class="w-full h-full fill-[#9edb6b]" viewbox="0 0 80 80">
<!-- Speaker Box -->
<path d="M22,30 L32,30 L45,18 L45,62 L32,50 L22,50 Q18,50 18,46 L18,34 Q18,30 22,30 Z"></path>
<!-- Sound wave segments -->
<path d="M52,28 Q60,34 60,40 Q60,46 52,52" fill="none" stroke="#9edb6b" stroke-linecap="round" stroke-width="6"></path>
</svg>
<!-- Diagonal Slash line for Muted State -->
<div class="absolute w-24 h-[4.5px] bg-[#6d7770] rounded-full transform -rotate-45 shadow-sm"></div>
</div>
</div>
<!-- Audio in arrivo Title -->
<h2 class="text-[23px] font-black text-[#15461c] mt-1 mb-1">
          Audio in arrivo
        </h2>
<!-- Description -->
<p class="text-sm font-bold text-[#446247] leading-snug px-4 mb-4">
          Potrai ascoltare questa frase prossimamente.
        </p>
<!-- Primary Green Button 'Ascolta un'altra carta' -->
<button class="w-full py-3.5 px-4 bg-[#2da61b] hover:bg-[#269116] active:scale-[0.99] text-white text-[17px] font-extrabold rounded-full shadow-md transition-all" type="button">
          Ascolta un’altra carta
        </button>
</section>
<!-- END: AudioPendingStatusBox -->
<!-- BEGIN: NavigationButtons -->
<!-- Secondary Row: Carta precedente & Carta successiva -->
<div class="w-full grid grid-cols-2 gap-2.5 mb-2.5" data-purpose="card-pagination">
<button class="flex items-center justify-center gap-1.5 py-2.5 px-3 bg-[#e8f3e1] active:bg-[#d8e8ce] rounded-full text-[#15461c] text-sm font-extrabold transition-colors" type="button">
<svg class="w-4 h-4 font-black" fill="none" stroke="currentColor" stroke-width="3" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Carta precedente</span>
</button>
<button class="flex items-center justify-center gap-1.5 py-2.5 px-3 bg-[#e8f3e1] active:bg-[#d8e8ce] rounded-full text-[#15461c] text-sm font-extrabold transition-colors" type="button">
<span>Carta successiva</span>
<svg class="w-4 h-4 font-black" fill="none" stroke="currentColor" stroke-width="3" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Torna alla galleria Main Button -->
<button class="w-full py-3 px-4 bg-[#2da61b] hover:bg-[#269116] active:scale-[0.99] text-white text-[16px] font-extrabold rounded-full flex items-center justify-center gap-2 shadow-sm transition-all" data-purpose="back-gallery-button" type="button">
<!-- 4-square Grid Icon -->
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<rect height="7.5" rx="1.5" width="7.5" x="3" y="3"></rect>
<rect height="7.5" rx="1.5" width="7.5" x="13.5" y="3"></rect>
<rect height="7.5" rx="1.5" width="7.5" x="3" y="13.5"></rect>
<rect height="7.5" rx="1.5" width="7.5" x="13.5" y="13.5"></rect>
</svg>
<span>Torna alla galleria</span>
</button>
<!-- END: NavigationButtons -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomNavigation -->
<nav aria-label="Menu Principale" class="absolute bottom-0 inset-x-0 bg-white border-t border-gray-100 px-3 py-2 flex justify-between items-center z-20" data-purpose="bottom-navigation-bar">
<!-- Home Tab -->
<button class="flex-1 flex flex-col items-center justify-center text-gray-700 py-1" type="button">
<svg class="w-6 h-6 stroke-current fill-none" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[11px] font-bold mt-0.5">Home</span>
</button>
<!-- Ascolta Tab (Active Pill) -->
<button class="flex-1 flex flex-col items-center justify-center bg-[#dff3d1] text-[#13471c] py-1 px-2 rounded-2xl" type="button">
<svg class="w-6 h-6 stroke-current fill-none" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z" stroke-linecap="round" stroke-linejoin="round"></path>
<!-- Headset shape overlay -->
<path d="M4 14v-3a8 8 0 0116 0v3a2 2 0 01-2 2h-1a2 2 0 01-2-2v-2a2 2 0 012-2h3 M4 14a2 2 0 002 2h1a2 2 0 002-2v-2a2 2 0 00-2-2H4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[11px] font-extrabold mt-0.5">Ascolta</span>
</button>
<!-- Scopri Tab -->
<button class="flex-1 flex flex-col items-center justify-center text-gray-700 py-1" type="button">
<svg class="w-6 h-6 stroke-current fill-none" stroke-width="2.2" viewbox="0 0 24 24">
<rect height="15" rx="2" stroke-linecap="round" stroke-linejoin="round" width="12" x="7" y="3"></rect>
<path d="M5 7L5 19a2 2 0 002 2h10" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[11px] font-bold mt-0.5">Scopri</span>
</button>
<!-- Crea Tab -->
<button class="flex-1 flex flex-col items-center justify-center text-gray-700 py-1" type="button">
<svg class="w-6 h-6 stroke-current fill-none" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[11px] font-bold mt-0.5">Crea</span>
</button>
<!-- FAQ Tab -->
<button class="flex-1 flex flex-col items-center justify-center text-gray-700 py-1" type="button">
<svg class="w-6 h-6 stroke-current fill-none" stroke-width="2.2" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9"></circle>
<path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="12" cy="17" fill="currentColor" r="0.75"></circle>
</svg>
<span class="text-[11px] font-bold mt-0.5">FAQ</span>
</button>
</nav>
<!-- END: BottomNavigation -->
</div>
<!-- END: MobileDeviceFrame -->
</body></html>
